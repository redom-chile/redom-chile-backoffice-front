<!DOCTYPE html>
<html lang="es" data-theme="base" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Redom</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="assets/brand/redom-app-icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/redom-icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/brand/redom-icon-180.png" />
    <meta name="theme-color" content="#1C1815" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- Aplica modo y color antes de que cargue Angular (evita el parpadeo claro/oscuro). -->
    <script>
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem('theme') || 'null') || {};
          var mode = t.v === 2 ? t.mode : 'system';
          var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var html = document.documentElement;
          html.className = dark ? 'dark' : 'light';
          html.setAttribute('data-theme', localStorage.getItem('redom.brand-color') || 'base');
          if (t.direction === 'rtl') html.setAttribute('dir', 'rtl');
        } catch (e) {}
      })();
    </script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=shield_question" />
  </head>

  <body class="bg-background font-poppins selection:bg-primary selection:text-primary-foreground">
    <!-- Pantalla de carga mientras arranca Angular; main.ts la desvanece (mínimo 1 s visible). Estilos inline: no depende del CSS de la app. -->
    <style>
      .redom-boot { position: fixed; inset: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background: var(--background, #fbf8f3); color: #1c1815; --boot-ink: #1c1815; --boot-dot: #e5532a; font-family: Geist, system-ui, sans-serif;
        z-index: 10000; transition: opacity .45s ease, visibility .45s; }
      .redom-boot.is-done { opacity: 0; visibility: hidden; pointer-events: none; }
      html.dark .redom-boot { background: var(--background, #1c1815); color: #f4eee6; --boot-ink: #f4eee6; --boot-dot: #f0663c; }
      /* Manchas que flotan detrás del vidrio: salen del color elegido (--primary según data-theme, que fija el script del <head>). */
      .redom-boot__blob { position: absolute; width: 46vmax; height: 46vmax; border-radius: 9999px; filter: blur(70px); opacity: .55; will-change: transform; }
      .redom-boot__blob--a { background: var(--primary, #e5532a); top: -12vmax; left: -8vmax; animation: redom-boot-float-a 9s ease-in-out infinite alternate; }
      .redom-boot__blob--b { background: color-mix(in oklab, var(--primary, #e5532a) 55%, #ffffff); bottom: -16vmax; right: -10vmax; animation: redom-boot-float-b 11s ease-in-out infinite alternate; }
      .redom-boot__blob--c { background: color-mix(in oklab, var(--primary, #e5532a) 70%, #1c1815); width: 34vmax; height: 34vmax; bottom: -6vmax; left: 12vmax; opacity: .35; animation: redom-boot-float-c 13s ease-in-out infinite alternate; }
      /* Con color relativo, tonos vecinos del primario (más vivos que la mezcla de respaldo). */
      @supports (color: oklch(from red l c h)) {
        .redom-boot__blob--b { background: oklch(from var(--primary, #e5532a) calc(l + 0.12) c calc(h + 35)); }
        .redom-boot__blob--c { background: oklch(from var(--primary, #e5532a) calc(l - 0.08) c calc(h - 40)); }
      }
      html.dark .redom-boot__blob { opacity: .45; }
      html.dark .redom-boot__blob--c { opacity: .55; }
      /* Tarjeta de vidrio con el isotipo */
      .redom-boot__glass { position: relative; display: flex; align-items: center; justify-content: center; width: 128px; height: 128px; border-radius: 36px;
        background: rgba(255, 255, 255, .38); border: 1px solid rgba(255, 255, 255, .7);
        -webkit-backdrop-filter: blur(22px) saturate(150%); backdrop-filter: blur(22px) saturate(150%);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, .8), 0 30px 60px -24px rgba(28, 24, 21, .35);
        animation: redom-boot-breathe 3.2s ease-in-out infinite; }
      html.dark .redom-boot__glass { background: rgba(251, 248, 243, .07); border-color: rgba(255, 255, 255, .16);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), 0 30px 60px -24px rgba(0, 0, 0, .7); }
      .redom-boot svg { width: 60px; height: 60px; overflow: visible; }
      .redom-boot__arc { stroke: var(--boot-ink); stroke-dasharray: 100; animation: redom-boot-arc 1.6s cubic-bezier(.65, 0, .35, 1) infinite; }
      .redom-boot__dot { fill: var(--boot-dot); transform-origin: 75.24px 17.69px; animation: redom-boot-dot 1.6s ease-in-out infinite; }
      .redom-boot__text { position: relative; margin: 0; font-size: 14px; font-weight: 500; letter-spacing: .01em; opacity: .7; }
      @keyframes redom-boot-arc { 0% { stroke-dashoffset: 100; opacity: 1; } 55%, 85% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
      @keyframes redom-boot-dot { 0%, 45% { transform: scale(.6); opacity: .4; } 65% { transform: scale(1.15); opacity: 1; } 75%, 85% { transform: scale(1); opacity: 1; } 100% { transform: scale(.6); opacity: .4; } }
      @keyframes redom-boot-breathe { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-6px) scale(1.02); } }
      @keyframes redom-boot-float-a { to { transform: translate(18vmax, 12vmax) scale(1.1); } }
      @keyframes redom-boot-float-b { to { transform: translate(-16vmax, -10vmax) scale(.9); } }
      @keyframes redom-boot-float-c { to { transform: translate(14vmax, -14vmax) scale(1.15); } }
      @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
        .redom-boot__glass { background: #ffffff; }
        html.dark .redom-boot__glass { background: #2a241f; }
      }
      @media (prefers-reduced-motion: reduce) {
        .redom-boot__arc, .redom-boot__dot, .redom-boot__glass, .redom-boot__blob { animation: none; stroke-dashoffset: 0; opacity: 1; transform: none; }
        .redom-boot__blob { opacity: .45; }
      }
    </style>
    <div class="redom-boot" role="status" aria-label="Cargando Redom">
      <span class="redom-boot__blob redom-boot__blob--a" aria-hidden="true"></span>
      <span class="redom-boot__blob redom-boot__blob--b" aria-hidden="true"></span>
      <span class="redom-boot__blob redom-boot__blob--c" aria-hidden="true"></span>
      <div class="redom-boot__glass">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
          <path class="redom-boot__arc" d="M55.71 9.4A41 41 0 1 0 88.01 34.64" pathLength="100" fill="none" stroke-width="18" />
          <circle class="redom-boot__dot" cx="75.24" cy="17.69" r="10" />
        </svg>
      </div>
      <p class="redom-boot__text" aria-hidden="true">Todo tu restaurante, en una vuelta.</p>
    </div>
    <app-root></app-root>
  </body>
</html>
