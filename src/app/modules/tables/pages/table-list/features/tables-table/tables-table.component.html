<app-table>
  <ng-template app-slot="head">
    <tr>
      @for (item of headerData; track $index) {
      <th class="h-8 w-[20%] text-center">{{ item }}</th>
      }
      <th class="w-[130px]"></th>
    </tr>
  </ng-template>
  @if (!isLoading()) { @for (table of $tables(); track table.id) {
  <tr class="glass-row h-10">
    <td class="text-center font-medium">{{ table.name }}</td>
    <td class="text-muted-foreground text-center">{{ table.capacity }} pers.</td>
    <td class="text-muted-foreground text-center">{{ table.location || '—' }}</td>
    <td class="text-center">
      <span class="inline-block rounded-full px-2 py-0.5 text-xs font-medium" [ngClass]="statusClasses(table.status)">
        {{ statusLabel(table.status) }}
      </span>
    </td>
    <td class="w-[130px] text-center">
      <div class="flex items-center justify-center gap-1">
        <app-button size="small" icon="qr_code_2" [attr.aria-label]="'QR de ' + table.name" (click)="showQr(table)" />
        <app-button *appCheckPermission="PERMISSIONS.TABLES.UPDATE_TABLE" size="small" icon="edit_document" (click)="updateTable(table)" />
        <app-button *appCheckPermission="PERMISSIONS.TABLES.DELETE_TABLE" size="small" icon="delete" tone="danger" (click)="deleteTable(table)" />
      </div>
    </td>
  </tr>
  } @empty {
  <tr>
    <td class="py-4 text-center text-sm" colspan="6">No hay mesas</td>
  </tr>
  } } @if (isLoading()) {
  <tr>
    <td colspan="6" class="px-2 py-4"><app-progress-bar /></td>
  </tr>
  }
</app-table>
