<app-modal-card>
  <ng-template app-slot="header">
    <h2 class="text-xl font-semibold text-gray-900 dark:text-gray-100">Editar Categoría</h2>
  </ng-template>

  <form [formGroup]="form" (ngSubmit)="handleSubmit()" class="space-y-4">
    <div>
      <label class="mb-1 block text-sm font-medium text-gray-700 dark:text-gray-300"> Nombre * </label>
      <input
        type="text"
        formControlName="name"
        class="w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-100"
        [ngClass]="{ 'border-red-500': form.get('name')?.invalid && form.get('name')?.touched }" />
    </div>

    <div>
      <label class="mb-1 block text-sm font-medium text-gray-700 dark:text-gray-300"> Código corto </label>
      <input
        type="text"
        formControlName="shortCode"
        maxlength="10"
        placeholder="Opcional. Ej: BEB"
        class="w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-100" />
    </div>

    <div>
      <label class="mb-1 block text-sm font-medium text-gray-700 dark:text-gray-300"> Descripción </label>
      <textarea
        formControlName="description"
        rows="3"
        class="w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-100"></textarea>
    </div>

    <app-image-picker
      folder="categories"
      label="Imagen"
      [currentUrl]="category.imageUrl"
      [uploading]="$isUploading()"
      [progress]="$uploadProgress()"
      (selectionChange)="onImageChange($event)" />

    @if ($canEditSchedule()) {
    <app-category-schedule-field [(schedule)]="$schedule" [submitted]="$scheduleSubmitted()" [note]="scheduleNote" />
    }
  </form>
  <ng-template app-slot="footer">
    <div class="flex justify-end gap-3">
      <app-button type="button" impact="light" [disabled]="$isLoading()" (buttonClick)="handleCancel()"> Cancelar </app-button>
      <app-button type="button" impact="bold" [disabled]="$isLoading()" (buttonClick)="handleSubmit()">
        @if ($isLoading()) {
        <span class="flex items-center gap-2">
          <svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none" />
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" />
          </svg>
          {{ $isUploading() ? 'Subiendo imagen...' : 'Actualizando...' }}
        </span>
        } @else { Actualizar Categoría }
      </app-button>
    </div>
  </ng-template>
</app-modal-card>
