<div class="min-h-screen p-3 sm:p-4" style="background: var(--background)">
  @if ($isReady()) {
  <div class="mb-3 flex items-center justify-between gap-2">
    <span class="text-muted-foreground inline-flex items-center gap-1 text-sm">
      <app-icon class="h-4 w-4">store</app-icon>{{ $config().locationName ?? 'Terminal de salón' }}
    </span>
    <div class="fixed right-3 top-3 z-50 flex items-center gap-1">
      <button type="button" class="flex h-10 w-10 items-center justify-center rounded-full bg-black/25 text-white backdrop-blur" [attr.aria-label]="$isFullscreen() ? 'Salir de pantalla completa' : 'Pantalla completa'" (click)="toggleFullscreen()">
        <app-icon class="h-5 w-5">{{ $isFullscreen() ? 'fullscreen_exit' : 'fullscreen' }}</app-icon>
      </button>
      <button type="button" class="flex h-10 w-10 items-center justify-center rounded-full bg-black/25 text-white backdrop-blur" aria-label="Administrar terminal" title="Administrar" (click)="openAdmin()">
        <app-icon class="h-5 w-5">settings</app-icon>
      </button>
    </div>
  </div>

  <app-pos-terminal
    [terminalMode]="true"
    [fixedLocationId]="$config().locationId"
    [locationName]="$config().locationName"
    [inactivitySeconds]="$config().inactivitySeconds" />
  } @else {
  <div class="flex min-h-[80vh] flex-col items-center justify-center gap-4 text-center">
    <app-icon class="text-primary h-14 w-14">tablet</app-icon>
    <h1 class="text-foreground text-xl font-semibold">Este equipo no está configurado como terminal</h1>
    <p class="text-muted-foreground max-w-md text-sm">Un administrador debe activarlo desde Equipos y pagos → Terminal de salón, eligiendo la sucursal.</p>
    <a routerLink="/settings/terminal" class="bg-primary rounded-lg px-4 py-2 font-medium text-white">Configurar</a>
  </div>
  }
</div>
