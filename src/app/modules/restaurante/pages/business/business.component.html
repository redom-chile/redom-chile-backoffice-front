<app-header-dashboard title="Mi Negocio" subtitle="Información y configuración de tu restaurante">
  <app-button full impact="none" tone="primary" shape="rounded" size="medium" (buttonClick)="retry()">
    <app-icon class="h-6 w-7"> refresh </app-icon>
  </app-button>
  @if (!business) {
  <app-button full impact="bold" tone="primary" shape="rounded" size="medium" (buttonClick)="createNewBusiness()">
    <app-icon class="h-6 w-7"> add </app-icon>
    Crear
  </app-button>
  }
</app-header-dashboard>

@if (business) {
<div class="mb-4 flex gap-1" role="tablist" aria-label="Secciones de Mi negocio">
  @for (tab of tabs; track tab.value) {
  <button
    type="button"
    role="tab"
    class="rounded-full px-4 py-1.5 text-sm font-medium"
    [class]="$tab() === tab.value ? 'bg-primary text-white' : 'glass-row text-foreground'"
    [attr.aria-selected]="$tab() === tab.value"
    (click)="selectTab(tab.value)">
    {{ tab.label }}
  </button>
  }
</div>

@if ($tab() === 'inventario') {
<app-inventory-settings />
} @else {
<app-business-detail [business]="business" />
}
} @else if (isLoading) {
<app-business-detail-skeleton />
} @else {
<app-card>
  <div class="flex flex-col items-center justify-center py-8 text-center">
    <app-icon class="text-muted-foreground mb-4 h-16 w-16">store</app-icon>
    <h3 class="text-foreground mb-2 text-lg font-semibold">No tienes un negocio creado</h3>
    <p class="text-muted-foreground mb-4 text-sm">Crea tu primer negocio para comenzar a configurar tu restaurante.</p>
    <app-button full impact="bold" tone="primary" (buttonClick)="createNewBusiness()">
      <app-icon class="h-5 w-5"> add </app-icon>
      Crear negocio
    </app-button>
  </div>
</app-card>
}
