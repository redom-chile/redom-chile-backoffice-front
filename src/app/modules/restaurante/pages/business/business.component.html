<app-header-dashboard title="Mi Negocio" subtitle="Información y configuración de tu restaurante">
  <app-button full impact="none" tone="primary" shape="rounded" size="medium" (buttonClick)="retry()">
    <app-icon class="h-6 w-7"> refresh </app-icon>
  </app-button>
</app-header-dashboard>

@if (business) {
<div class="mb-4 flex gap-1" role="tablist" aria-label="Secciones de Mi negocio">
  @for (tab of tabs; track tab.value) {
  <button
    type="button"
    role="tab"
    class="rounded-full px-4 py-1.5 text-sm font-medium"
    [class]="$tab() === tab.value ? 'bg-primary text-white' : 'glass-row text-foreground'"
    [attr.aria-selected]="$tab() === tab.value"
    (click)="selectTab(tab.value)">
    {{ tab.label }}
  </button>
  }
</div>

@if ($tab() === 'inventario') {
<app-inventory-settings />
} @else {
<app-business-detail [business]="business" />
}
} @else if (isLoading) {
<app-business-detail-skeleton />
} @else {
<app-empty-state icon="store" title="Aún no tienes un negocio" description="Crea tu negocio para empezar a vender y configurar tu restaurante.">
  <app-button impact="bold" tone="primary" shape="rounded" (buttonClick)="goToOnboarding()">
    <app-icon class="h-5 w-5">add</app-icon>
    Crear negocio
  </app-button>
</app-empty-state>
}
