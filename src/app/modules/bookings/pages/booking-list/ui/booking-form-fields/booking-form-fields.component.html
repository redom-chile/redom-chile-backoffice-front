@let f = form();
<div [formGroup]="f" class="grid grid-cols-2 gap-4">
  <div>
    <label class="text-foreground mb-1 block text-sm font-medium">Fecha *</label>
    <input type="date" formControlName="date" [class]="inputClass" />
  </div>
  <div>
    <label class="text-foreground mb-1 block text-sm font-medium">Hora *</label>
    <input type="time" formControlName="time" step="900" [class]="inputClass" />
  </div>

  <div>
    <span class="text-foreground mb-1 block text-sm font-medium">Personas *</span>
    <div class="flex items-center gap-2">
      <button type="button" class="glass-row flex h-10 w-10 items-center justify-center rounded-md" aria-label="Una persona menos" (click)="changePartySize(-1)">
        <app-icon class="h-5 w-5">remove</app-icon>
      </button>
      <input type="number" formControlName="partySize" min="1" inputmode="numeric" aria-label="Cantidad de personas" class="glass-input w-16 rounded-md px-2 py-2 text-center font-semibold" />
      <button type="button" class="glass-row flex h-10 w-10 items-center justify-center rounded-md" aria-label="Una persona más" (click)="changePartySize(1)">
        <app-icon class="h-5 w-5">add</app-icon>
      </button>
    </div>
  </div>
  <div>
    <label class="text-foreground mb-1 block text-sm font-medium">Duración</label>
    <select formControlName="duration" [class]="inputClass">
      @for (minutes of durations; track minutes) {
      <option [ngValue]="minutes">{{ durationLabel(minutes) }}</option>
      }
    </select>
  </div>

  <div class="col-span-2">
    <label class="text-foreground mb-1 block text-sm font-medium">Mesa</label>
    <select #tableSelect formControlName="tableId" [class]="inputClass">
      <option [ngValue]="null">Sin mesa asignada</option>
      @for (table of $availableTables(); track table.id) {
      <option [ngValue]="table.id" [disabled]="table.capacity < $partySize()">
        {{ table.name }} · {{ table.capacity }} pers.{{ table.capacity < $partySize() ? ' (muy chica)' : '' }}
      </option>
      }
    </select>
  </div>

  @if (showStatus()) {
  <div class="col-span-2">
    <label class="text-foreground mb-1 block text-sm font-medium">Estado</label>
    <select formControlName="status" [class]="inputClass">
      @for (option of statusOptions; track option.value) {
      <option [ngValue]="option.value">{{ option.label }}</option>
      }
    </select>
  </div>
  }

  <div class="col-span-2">
    <label class="text-foreground mb-1 block text-sm font-medium">Nota</label>
    <textarea formControlName="note" rows="2" maxlength="1000" placeholder="Cumpleaños, silla de bebé, alergias…" [class]="inputClass"></textarea>
  </div>
</div>
