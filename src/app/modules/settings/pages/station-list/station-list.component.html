<div>
  <app-header-dashboard title="Estaciones" subtitle="Dónde se prepara cada producto: cocina, bar, parrilla…">
    @if (!$isEmpty()) {
    <app-button
      *appCheckPermission="PERMISSIONS.STATIONS.CREATE_STATION"
      full
      impact="bold"
      tone="primary"
      shape="rounded"
      size="medium"
      icon="add"
      (buttonClick)="handleCreate()">
      Agregar estación
    </app-button>
    }
  </app-header-dashboard>

  @if ($errorMessage(); as errorMessage) {
  <div class="flex flex-col items-center gap-4 py-16 text-center">
    <app-icon class="text-destructive h-14 w-14">error_outline</app-icon>
    <div>
      <h2 class="text-foreground text-lg font-semibold">Error al cargar las estaciones</h2>
      <p class="text-muted-foreground mt-1 text-sm">{{ errorMessage }}</p>
    </div>
    <app-button impact="bold" tone="primary" shape="rounded" (buttonClick)="handleRetry()">Reintentar</app-button>
  </div>
  } @else if ($isEmpty()) {
  <app-empty-state
    icon="soup_kitchen"
    title="Aún no tienes estaciones"
    description="Crea una estación por cada zona de preparación (Cocina, Bar…), asígnale una impresora y los productos que prepara. Así cada comanda llega al lugar correcto.">
    <app-button
      *appCheckPermission="PERMISSIONS.STATIONS.CREATE_STATION"
      impact="bold"
      tone="primary"
      shape="rounded"
      icon="add"
      (buttonClick)="handleCreate()">
      Agregar estación
    </app-button>
  </app-empty-state>
  } @else {
  <app-stations-grid
    [stations]="$stations()"
    [loading]="$isLoading() && !$stations().length"
    [printerNames]="$printerNames()"
    [locationNames]="$locationNames()"
    (manageProducts)="handleManageProducts($event)"
    (edit)="handleUpdate($event)"
    (delete)="handleDelete($event)" />
  }
</div>
