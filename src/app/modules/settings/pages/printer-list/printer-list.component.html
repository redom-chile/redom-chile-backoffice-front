<div>
  <app-header-dashboard title="Impresoras" subtitle="Impresoras de comandas y boletas de tu local">
    @if (!$isEmpty()) {
    <app-button
      *appCheckPermission="PERMISSIONS.PRINTERS.CREATE_PRINTER"
      full
      impact="bold"
      tone="primary"
      shape="rounded"
      size="medium"
      icon="add"
      (buttonClick)="handleCreate()">
      Agregar impresora
    </app-button>
    }
  </app-header-dashboard>

  @if ($errorMessage(); as errorMessage) {
  <div class="flex flex-col items-center gap-4 py-16 text-center">
    <app-icon class="text-destructive h-14 w-14">error_outline</app-icon>
    <div>
      <h2 class="text-foreground text-lg font-semibold">Error al cargar las impresoras</h2>
      <p class="text-muted-foreground mt-1 text-sm">{{ errorMessage }}</p>
    </div>
    <app-button impact="bold" tone="primary" shape="rounded" (buttonClick)="handleRetry()">Reintentar</app-button>
  </div>
  } @else if ($isEmpty()) {
  <app-empty-state
    icon="print"
    title="Aún no tienes impresoras"
    description="Agrega las impresoras de tu local y asígnalas a las estaciones (Cocina, Bar…) para imprimir las comandas automáticamente.">
    <app-button
      *appCheckPermission="PERMISSIONS.PRINTERS.CREATE_PRINTER"
      impact="bold"
      tone="primary"
      shape="rounded"
      icon="add"
      (buttonClick)="handleCreate()">
      Agregar impresora
    </app-button>
  </app-empty-state>
  } @else {
  <app-printers-table
    [printers]="$printers()"
    [loading]="$isLoading() && !$printers().length"
    [locationNames]="$locationNames()"
    [now]="$now()"
    [testingIds]="$testingIds()"
    (test)="handleTest($event)"
    (edit)="handleUpdate($event)"
    (delete)="handleDelete($event)" />
  }
</div>
