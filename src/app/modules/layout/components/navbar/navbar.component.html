<div class="glass app-glass-frame relative">
  <div class="mx-auto px-5">
    <div class="flex items-center justify-between py-3.5 md:justify-start">
      <!-- Mobile Navigation Menu Button -->
      <div class="sm:order-1 md:hidden">
        <button
          (click)="toggleMobileSidebar()"
          type="button"
          class="bg-muted text-muted-foreground focus:ring-primary hover:bg-muted-foreground hover:text-muted inline-flex items-center justify-center rounded-md p-2 focus:outline-hidden focus:ring-2 focus:ring-inset"
          aria-expanded="false">
          <span class="sr-only">Open menu</span>
          <app-icon> menu </app-icon>
        </button>
      </div>

      <!-- Logo -->
      <div class="flex items-center justify-start gap-3 sm:order-2 ltr:md:mr-10 rtl:md:ml-10 lg:hidden">
        <a routerLink="/dashboard/admin" class="flex items-center rounded-md focus:outline-hidden focus-visible:ring-1">
          <app-redom-logo class="h-5" />
        </a>
      </div>

      <!-- Desktop Menu -->
      <div class="hidden space-x-10 sm:order-3 md:flex">
        <app-navbar-menu></app-navbar-menu>
      </div>

      <!-- Negocio + menú de perfil -->
      <div class="flex min-w-0 items-center justify-end gap-3 sm:order-4 md:flex-1 lg:w-0">
        @if ($businessName(); as businessName) {
        <a
          routerLink="/business"
          class="glass-row text-foreground hidden min-w-0 items-center gap-2 rounded-full px-3 py-1.5 text-sm font-medium transition-colors sm:inline-flex"
          [title]="businessName + ' · Mi negocio'">
          <app-icon class="text-primary h-4 w-4">storefront</app-icon>
          <span class="max-w-[14rem] truncate">{{ businessName }}</span>
        </a>
        }
        <app-profile-menu></app-profile-menu>
      </div>
    </div>
  </div>
  <!-- Mobile menu -->
  <app-navbar-mobile></app-navbar-mobile>
</div>
