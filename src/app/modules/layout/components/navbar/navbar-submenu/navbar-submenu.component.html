<ul #submenuRef class="glass-overlay mt-2 space-y-0.5 rounded-md py-3">
  @for (item of submenu; track item) {
  <li class="flex font-semibold">
    <!-- Condition -->
    <ng-container
      [ngTemplateOutlet]="item.children ? childMenu : parentMenu"
      [ngTemplateOutletContext]="{ item: item }">
    </ng-container>

    <!-- Parent Menu -->
    <ng-template #parentMenu let-item="item">
      <button
        [routerLink]="item.route"
        routerLinkActive="text-primary"
        [routerLinkActiveOptions]="{ exact: true }"
          class="text-muted-foreground glass-row mx-3 flex w-full items-center justify-between rounded-md py-2 px-2 text-xs font-semibold">
        <div class="flex items-center justify-start">
          @if (item.icon) {
          <span class="text-muted-foreground/50 ltr:mr-2 rtl:ml-2">
            <app-icon class="h-5 w-5">
              {{ item.icon}}
            </app-icon>
          </span>
          }
          <span class="ml-1">{{ item.label }}</span>
        </div>
        @if (item.locked) {
        <span class="ml-2 inline-flex"><app-icon class="text-muted-foreground/60 h-3.5 w-3.5 shrink-0" title="No incluido en tu plan" aria-label="No incluido en tu plan">lock</app-icon></span>
        }
      </button>
    </ng-template>

    <!-- Child Menu -->
    <ng-template #childMenu let-item="item">
      <div class="dropdown relative flex w-full">
        <button
        class="text-muted-foreground glass-row mx-3 flex w-full items-center justify-between rounded-md py-2 px-2 text-xs font-semibold">
          <div class="flex items-center justify-start">
            @if (item.icon) {
            <span class="text-muted-foreground/50 ltr:mr-2 rtl:ml-2">
              <app-icon class="h-5 w-5">
                {{ item.icon}}
              </app-icon>
            </span>
            }
            <span class="ml-1">{{ item.label }}</span>
          </div>
          <span class="rtl:rotate-180">
            <app-icon class="h-5 w-5 text-muted-foreground/50">
              chevron_right
            </app-icon>
          </span>
        </button>
        <!-- Submenu Dropdown -->
        <div
          class="dropdown-content absolute top-0 min-w-[200px] ltr:left-[100%] ltr:origin-top-left rtl:right-[100%] rtl:origin-top-right"
          navbar-submenu
          [submenu]="item.children"></div>
      </div>
    </ng-template>
  </li>
  }
</ul>
