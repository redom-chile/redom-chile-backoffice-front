<div class="glass flex h-full flex-col rounded-[1rem] p-4">
  <div class="relative mb-3">
    <app-icon class="text-muted-foreground pointer-events-none absolute left-3 top-1/2 h-5 w-5 -translate-y-1/2">search</app-icon>
    <input
      type="search"
      [formControl]="search"
      placeholder="Buscar producto…"
      aria-label="Buscar producto"
      class="glass-input w-full rounded-md py-2.5 pl-10 pr-3" />
  </div>

  <div class="-mx-1 mb-3 flex gap-2 overflow-x-auto px-1 pb-1" role="tablist" aria-label="Categorías">
    <button
      type="button"
      role="tab"
      class="shrink-0 rounded-full px-4 py-2 text-sm font-medium transition-colors"
      [class]="selectedCategoryId() === null ? 'bg-primary text-white' : 'glass-row text-foreground'"
      [attr.aria-selected]="selectedCategoryId() === null"
      (click)="categoryChange.emit(null)">
      Todos
    </button>
    @for (category of categories(); track category.id) {
    <button
      type="button"
      role="tab"
      class="shrink-0 rounded-full px-4 py-2 text-sm font-medium transition-colors"
      [class]="selectedCategoryId() === category.id ? 'bg-primary text-white' : 'glass-row text-foreground'"
      [attr.aria-selected]="selectedCategoryId() === category.id"
      (click)="categoryChange.emit(category.id)">
      {{ category.name }}
    </button>
    }
  </div>

  @if (loading()) {
  <app-progress-bar />
  }

  <div class="grid grid-cols-2 gap-3 sm:grid-cols-3 xl:grid-cols-4">
    @for (product of products(); track product.id) {
    @let quantity = quantities()[product.id] ?? 0;
    <button
      type="button"
      class="glass-row relative flex min-h-[96px] flex-col items-start justify-between gap-2 rounded-xl border-2 p-3 text-left transition-transform active:scale-95"
      [class.border-primary]="quantity > 0"
      [class.border-transparent]="quantity === 0"
      [attr.aria-label]="'Agregar ' + product.name"
      (click)="add.emit(product)">
      @if (quantity > 0) {
      <span class="bg-primary absolute -right-2 -top-2 flex h-6 min-w-6 items-center justify-center rounded-full px-1.5 text-xs font-bold text-white">
        {{ quantity }}
      </span>
      }
      <span class="text-foreground line-clamp-2 text-sm font-medium">{{ product.name }}</span>
      <span class="flex w-full items-center justify-between gap-1">
        <span class="text-primary text-sm font-semibold tabular-nums">{{ formatCurrency(price(product)) }}</span>
        @if (hasOptions(product)) {
        <span class="text-muted-foreground inline-flex items-center gap-0.5 rounded-full border border-[var(--border)] px-1.5 py-0.5 text-[10px] font-medium">
          <app-icon class="h-3 w-3">tune</app-icon>Opciones
        </span>
        }
      </span>
    </button>
    } @empty {
    @if (!loading()) {
    <p class="text-muted-foreground col-span-full py-10 text-center text-sm">No hay productos disponibles para esta búsqueda.</p>
    }
    }
  </div>
</div>
