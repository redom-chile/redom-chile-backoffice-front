<app-table>
  <ng-template app-slot="head">
    <tr>
      @for (item of headerData; track $index) {
      <th class="h-8 w-[33%] text-center">{{ item }}</th>
      }
      <th class="w-[90px]"></th>
    </tr>
  </ng-template>
  @if (!isLoading()) { @for (sector of $sectors(); track sector.id) {
  <tr class="glass-row h-10">
    <td class="text-center font-medium">{{ sector.name }}</td>

    <td class="text-center">
      <span class="inline-block rounded-full bg-green-500/20 px-2 py-0.5 text-xs font-medium text-green-600">
        Activo
      </span>
    </td>
    <td class="w-[90px] text-center">
      <div class="flex items-center justify-center gap-1">
        <app-button *appCheckPermission="PERMISSIONS.SECTORS.UPDATE_SECTOR" size="small" icon="edit_document" (click)="updateSector(sector)" />
        <app-button *appCheckPermission="PERMISSIONS.SECTORS.DELETE_SECTOR" size="small" icon="delete" tone="danger" (click)="deleteSector(sector)" />
      </div>
    </td>
  </tr>
  } @empty {
  <tr>
    <td class="py-4 text-center text-sm" colspan="6">
      No hay sectores<app-button full impact="none" tone="primary" shape="rounded" size="medium" (buttonClick)="retry()"
        ><app-icon class="h-6 w-7">refresh</app-icon></app-button
      >
    </td>
  </tr>
  } } @if (isLoading()) {
  <tr>
    <td colspan="6" class="px-2 py-4"><app-progress-bar /></td>
  </tr>
  }
  <ng-template app-slot="footer">
    <div class="glass-footer -mx-5 -mb-3 flex flex-wrap items-center justify-between gap-2 px-5 py-3">
      <div class="flex items-center gap-2">
        Mostrar<select class="glass-input w-16 rounded-md p-2" [value]="perPage()" (change)="onPerPageChange($event)">
          <option value="5">5</option>
          <option value="10">10</option>
          <option value="20">20</option>
          <option value="30">30</option>
          <option value="50">50</option></select
        >por página
      </div>
    </div>
  </ng-template>
</app-table>
