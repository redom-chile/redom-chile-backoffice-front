<div class="space-y-4">
  <app-header-dashboard title="Clientes" subtitle="Tus clientes y su historial de pedidos">
    @if ($tab() === 'list' && !$isEmpty()) {
    <app-button *appCheckPermission="PERMISSIONS.CUSTOMERS.CREATE_CUSTOMER" full impact="bold" tone="primary" shape="rounded" size="medium" icon="person_add" (buttonClick)="handleCreate()">Nuevo cliente</app-button>
    }
  </app-header-dashboard>

  <nav appTabList class="glass-input flex w-full gap-1 overflow-x-auto rounded-full p-1 sm:w-fit" aria-label="Secciones de clientes">
    @for (item of tabs; track item.id) {
    <button
      type="button"
      [id]="'customers-tab-' + item.id"
      class="inline-flex h-9 shrink-0 flex-1 items-center justify-center gap-1.5 rounded-full px-4 text-sm font-medium sm:flex-none"
      [class]="$tab() === item.id ? 'bg-primary text-primary-foreground' : 'text-muted-foreground hover:text-foreground'"
      [appTab]="$tab() === item.id"
      tabPanel="customers-panel"
      (click)="selectTab(item.id)">
      <app-icon class="h-4 w-4" aria-hidden="true">{{ item.icon }}</app-icon>{{ item.label }}
    </button>
    }
  </nav>

  <div id="customers-panel" role="tabpanel" [attr.aria-labelledby]="'customers-tab-' + $tab()" class="space-y-4">
    @if ($tab() === 'panel') {
    <app-customer-insights-panel />
    } @else if ($isEmpty()) {
    <app-empty-state icon="groups" title="Aún no tienes clientes" description="Crea clientes aquí o al tomar un pedido en el POS. Solo necesitas nombre y teléfono.">
      <app-button *appCheckPermission="PERMISSIONS.CUSTOMERS.CREATE_CUSTOMER" impact="bold" tone="primary" shape="rounded" icon="person_add" (buttonClick)="handleCreate()">Nuevo cliente</app-button>
    </app-empty-state>
    } @else {
    <div class="relative">
      <app-icon class="text-muted-foreground pointer-events-none absolute left-3 top-1/2 h-5 w-5 -translate-y-1/2">search</app-icon>
      <input type="search" [formControl]="search" placeholder="Buscar por nombre o teléfono…" aria-label="Buscar clientes" class="glass-input w-full rounded-md py-2.5 pl-10 pr-3 sm:max-w-md" />
    </div>

    @if ($hasError()) {
    <div class="flex flex-col items-center gap-4 py-16 text-center">
      <app-icon class="text-destructive h-14 w-14">error_outline</app-icon>
      <p class="text-foreground font-semibold">No se pudieron cargar los clientes</p>
      <app-button impact="bold" tone="primary" shape="rounded" (buttonClick)="handleRetry()">Reintentar</app-button>
    </div>
    } @else {
    <app-customers-table
      [customers]="$customers()"
      [loading]="$isLoading()"
      [pagination]="$pagination()"
      [searching]="!!$query().q"
      (pageChange)="handlePageChange($event)"
      (create)="handleCreate()" />
    }
    }
  </div>
</div>
