<div class="space-y-6 text-center">
  <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-green-500/15 text-green-600 dark:text-green-400">
    <app-icon class="h-9 w-9">check_circle</app-icon>
  </div>
  <div>
    <h2 class="text-foreground mb-1 break-words text-2xl font-semibold sm:text-3xl">¡{{ businessName() || 'Tu negocio' }} está listo <span class="text-primary">!</span></h2>
    <p class="text-muted-foreground text-sm">Ya puedes tomar tu primer pedido.</p>
  </div>

  @if ($summary().length) {
  <ul class="space-y-2 text-left">
    @for (item of $summary(); track item.icon) {
    <li class="text-foreground flex items-center gap-3 text-sm">
      <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-green-500/15 text-green-600 dark:text-green-400">
        <app-icon class="h-4 w-4">{{ item.icon }}</app-icon>
      </span>
      <span class="min-w-0 break-words">{{ item.text }}</span>
    </li>
    }
  </ul>
  }

  <div class="space-y-2">
    <app-button full impact="bold" tone="primary" shape="rounded" size="medium" type="button" icon="point_of_sale" (buttonClick)="goTo('/pos')">
      Tomar mi primer pedido
    </app-button>
    <button type="button" class="text-primary w-full py-2 text-sm font-semibold hover:underline" (click)="goTo('/dashboard/admin')">
      Ir al panel
    </button>
  </div>

  <div class="border-border/40 flex flex-wrap justify-center gap-x-4 gap-y-2 border-t pt-4">
    @for (link of links; track link.url) {
    <button type="button" class="text-muted-foreground hover:text-primary inline-flex items-center gap-1 text-xs font-medium" (click)="goTo(link.url)">
      <app-icon class="h-4 w-4">{{ link.icon }}</app-icon>{{ link.label }}
    </button>
    }
  </div>
</div>
