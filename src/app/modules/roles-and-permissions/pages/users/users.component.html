<app-header-dashboard
  *appCheckPermission="'users:see-module'"
  title="Usuarios"
  subtitle="Gestiona los usuarios del sistema.">
  <app-button
    *appCheckPermission="'users:get-all-users'"
    full
    impact="none"
    tone="primary"
    shape="rounded"
    size="medium"
    (buttonClick)="retry()">
    <app-icon class="h-6 w-7"> refresh </app-icon>
  </app-button>
  <app-button
    *appCheckPermission="'users:create-user'"
    full
    impact="bold"
    tone="primary"
    shape="rounded"
    size="medium"
    [class.opacity-50]="!limitGate.$canAdd()"
    [attr.title]="limitGate.$canAdd() ? null : limitTooltip"
    (buttonClick)="createUser()">
    <app-icon class="h-6 w-7"> {{ limitGate.$canAdd() ? 'add' : 'lock' }} </app-icon>
    Invitar al equipo
  </app-button>
</app-header-dashboard>
<app-plan-usage limit="max_users" class="-mt-2 mb-3" />
<app-plan-locked-notice limit="max_users" />

@let isLoading = $service.$isLoading(); @let usersResp = $service.$users();

<app-users-table
  *appCheckPermission="'users:get-all-users'"
  [isLoading]="isLoading"
  [users]="usersResp?.data ?? []"
  [branchNames]="$branchNames()"
  [pagination]="usersResp?.pagination ?? { page: 1, perPage: 10, totalItems: 0, totalPages: 0 }"
  (pageChange)="onPageChange($event)"
  (perPageChange)="onPerPageChange($event)"
  (searchNameChange)="onSearchNameChange($event)"
  (retryData)="retry()" />
