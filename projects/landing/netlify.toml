# REDOM Landing
# Base directory de Netlify: raíz del repositorio
# Publicación: dist/landing/browser

[build]
command = "npm run build:landing"
publish = "dist/landing/browser"

[build.environment]
NODE_VERSION = "22"

# Desarrollo: rama develop
[context.develop]
command = "npm run build:landing && cp projects/landing/_redirects.develop dist/landing/browser/_redirects"

# Producción
[context.production]
command = "npm run build:landing && cp projects/landing/_redirects.production dist/landing/browser/_redirects"

# Widget de la carta
[[headers]]
for = "/widget.js"

[headers.values]
Cache-Control = "public, max-age=300"
Content-Type = "text/javascript; charset=utf-8"