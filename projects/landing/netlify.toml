# Sitio Netlify de la landing (redom.cl). En el sitio: Base directory = (raíz del repo),
# Package directory = projects/landing, para que Netlify lea este archivo y no el de la raíz (app.redom.cl).
[build]
command = "npm run build:landing"
publish = "dist/landing/browser"

[build.environment]
NODE_VERSION = "22"

# Planes públicos: Netlify pide la API por la landing (mismo origen, sin CORS).
# URL de billing en AWS por confirmar con el backend.
[[redirects]]
from = "/billing/api/*"
to = "https://3rns8qoa8g.execute-api.us-east-1.amazonaws.com/billing/api/:splat"
status = 200
force = true

# Es una sola página: cualquier ruta desconocida muestra la portada.
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
