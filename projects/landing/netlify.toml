# Sitio Netlify de la landing (redom.cl)
# Base directory = raíz del repositorio
# Package directory = projects/landing

[build]
command = "npm run build:landing"
publish = "dist/landing/browser"

[build.environment]
NODE_VERSION = "22"

# ============================================================
# DESARROLLO
# ============================================================

[context.develop]
command = "npm run build:landing"

# Facturación: API de desarrollo
[[context.develop.redirects]]
from = "/billing/api/*"
to = "https://8wsrt1c4dk.execute-api.us-east-1.amazonaws.com/billing/api/:splat"
status = 200
force = true

# Carta pública: API de desarrollo
[[context.develop.redirects]]
from = "/restaurant/api/public/*"
to = "https://8wsrt1c4dk.execute-api.us-east-1.amazonaws.com/restaurant/api/public/:splat"
status = 200
force = true

# ============================================================
# PRODUCCIÓN
# ============================================================

[context.production]
command = "npm run build:landing"

# Planes públicos: API de producción
[[context.production.redirects]]
from = "/billing/api/*"
to = "https://7t7c2w8zzf.execute-api.us-east-1.amazonaws.com/billing/api/:splat"
status = 200
force = true

# Carta pública: API de producción
[[context.production.redirects]]
from = "/restaurant/api/public/*"
to = "https://7t7c2w8zzf.execute-api.us-east-1.amazonaws.com/restaurant/api/public/:splat"
status = 200
force = true

# ============================================================
# CARTA PÚBLICA
# La carta se arma en el navegador (RenderMode.Client).
# ============================================================

[[redirects]]
from = "/carta/*"
to = "/index.csr.html"
status = 200

[[redirects]]
from = "/carta"
to = "/index.csr.html"
status = 200

# ============================================================
# RUTAS DE ANGULAR: debe permanecer al final
# ============================================================

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# ============================================================
# WIDGET DE LA CARTA
# ============================================================

[[headers]]
for = "/widget.js"

[headers.values]
Cache-Control = "public, max-age=300"
Content-Type = "text/javascript; charset=utf-8"